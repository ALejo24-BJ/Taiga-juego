function showMenu(){save();playing=false;inMenu=true;hud.style.display='none';controls.style.display='none';overlay.style.display='flex';
 panel.innerHTML=`<h1>🌲 TAIGA</h1><h2>V4.0 ❄️</h2><p>Explora el bosque boreal: pelea contra los osos, junta monedas, descansa en las fogatas y busca los 3 secretos ocultos del nivel 1.</p><p>🪙 Monedas: <b>${coins}</b>　👕 Atuendo: <b>${outfits.find(o=>o.id===equipped).name}</b></p><button id="play">▶ JUGAR</button><button id="shop" class="secondary">🛒 TIENDA</button><p class="small">${touchMode?'Cruceta ◀ ▶ moverte · ▲ ▼ apuntar arriba/abajo · ⬆ saltar (¡doble salto!) · ⚔ atacar<br>Ataca hacia abajo en el aire para rebotar en enemigos y picos':'PC: A/D o ←/→ moverte · Espacio saltar (¡doble salto!) · Z o J atacar ⚔<br>Atacar arriba: W/↑ + Z · Atacar abajo en el aire: S/↓ + Z (¡rebota en enemigos y picos!)'}<br>🌲 Los pinos curan 1 ❤ · 🔥 Las fogatas curan toda tu vida (1 vez c/u) y son tu punto de reaparición · 🪙 15 monedas por nivel<br>🐻 Los osos avisan con ❗ antes de atacar: ¡golpéalos cuando quedan aturdidos!</p>`;
 document.getElementById('play').onclick=showDiff;document.getElementById('shop').onclick=showShop}

function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}

 ctx.fillStyle='#f4fbff33';ctx.beginPath();ctx.arc(820,95,46,0,7);ctx.fill();ctx.fillStyle='#f4fbffee';ctx.beginPath();ctx.arc(820,95,26,0,7);ctx.fill();
